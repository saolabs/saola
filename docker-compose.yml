services:
  # Full development runtime: Laravel + Vite + Saola compiler/client watchers.
  app:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    container_name: saola_dev
    working_dir: /workspace/saola
    init: true
    tty: true
    stdin_open: true
    ports:
      - "8686:8080"
      - "5174:5173"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8686
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: one_laravel
      DB_USERNAME: one_laravel
      DB_PASSWORD: one_laravel123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEV_HOST: 0.0.0.0
      DEV_PORT: 8080
      VITE_DEV_HOST: 0.0.0.0
      VITE_HMR_HOST: localhost
      VITE_DEV_PORT: 5173
      VITE_HMR_CLIENT_PORT: 5174
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
    volumes:
      - ..:/workspace
      - saola_vendor:/workspace/saola/vendor
      - saola_node_modules:/workspace/saola/node_modules
      - client_node_modules:/workspace/client/node_modules
      - compiler_node_modules:/workspace/compiler/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    networks:
      - one-laravel_network

  # Redis service cho cache và session
  redis:
    image: redis:7-alpine
    container_name: one-laravel_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: unless-stopped
    networks:
      - one-laravel_network
    environment:
      - TZ=Asia/Ho_Chi_Minh

  # Redis Commander - Web UI để quản lý Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: one-laravel_redis_commander
    ports:
      - "8687:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin123
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - one-laravel_network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: one-laravel_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: one_laravel
      POSTGRES_USER: one_laravel
      POSTGRES_PASSWORD: one_laravel123
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one_laravel -d one_laravel"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    networks:
      - one-laravel_network

  # pgAdmin để quản lý PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: one-laravel_pgadmin
    ports:
      - "8688:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@saola.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - one-laravel_network

volumes:
  saola_vendor:
    driver: local
  saola_node_modules:
    driver: local
  client_node_modules:
    driver: local
  compiler_node_modules:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  one-laravel_network:
    driver: bridge
